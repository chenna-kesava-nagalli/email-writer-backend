spring.application.name=Email-Writer

# Cloud hosts tell the app which port to use through the PORT variable.
# On your laptop PORT is not set, so it falls back to 8080.
server.port=${PORT:8080}

gemini.api.url=${GEMINI_URL}
gemini.api.key=${GEMINI_KEY}

# Optional backup model, used automatically when the main model is busy.
# Leave GEMINI_FALLBACK_URL unset to turn this off.
gemini.api.fallback-url=${GEMINI_FALLBACK_URL:}

# Max "AI Reply" calls per person (IP address) per minute.
app.rate-limit.per-minute=10
